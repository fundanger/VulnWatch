version: "3.9"

# Secrets are passed as environment variables — never mount config.ini into the image.
# Copy .env.example to .env and fill in your values, then run: docker compose up

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     cveemailer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cveemailer}
      POSTGRES_DB:       cveemailer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cveemailer"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:        postgresql+psycopg2://cveemailer:${POSTGRES_PASSWORD:-cveemailer}@db:5432/cveemailer
      API_SECRET:          ${API_SECRET:-}
      # Email credentials
      CVE_SENDER_EMAIL:    ${CVE_SENDER_EMAIL:-}
      CVE_SENDER_PASSWORD: ${CVE_SENDER_PASSWORD:-}
      CVE_RECIPIENT_EMAIL: ${CVE_RECIPIENT_EMAIL:-}
      # NVD & integrations
      NVD_API_KEY:         ${NVD_API_KEY:-}
      CVE_WEBHOOK_URL:     ${CVE_WEBHOOK_URL:-}
      CVE_SLACK_WEBHOOK:   ${CVE_SLACK_WEBHOOK:-}
      # Jira (optional)
      JIRA_URL:            ${JIRA_URL:-}
      JIRA_USER:           ${JIRA_USER:-}
      JIRA_TOKEN:          ${JIRA_TOKEN:-}
      JIRA_PROJECT_KEY:    ${JIRA_PROJECT_KEY:-}
      # ServiceNow (optional)
      SNOW_INSTANCE:       ${SNOW_INSTANCE:-}
      SNOW_USER:           ${SNOW_USER:-}
      SNOW_PASSWORD:       ${SNOW_PASSWORD:-}
    volumes:
      - logs:/app/logs

  scanner:
    build: .
    restart: unless-stopped
    command: >
      sh -c "while true; do python scheduler.py run; sleep ${SCAN_INTERVAL:-3600}; done"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL:        postgresql+psycopg2://cveemailer:${POSTGRES_PASSWORD:-cveemailer}@db:5432/cveemailer
      CVE_SENDER_EMAIL:    ${CVE_SENDER_EMAIL:-}
      CVE_SENDER_PASSWORD: ${CVE_SENDER_PASSWORD:-}
      CVE_RECIPIENT_EMAIL: ${CVE_RECIPIENT_EMAIL:-}
      NVD_API_KEY:         ${NVD_API_KEY:-}
      CVE_WEBHOOK_URL:     ${CVE_WEBHOOK_URL:-}
      CVE_SLACK_WEBHOOK:   ${CVE_SLACK_WEBHOOK:-}
      JIRA_URL:            ${JIRA_URL:-}
      JIRA_USER:           ${JIRA_USER:-}
      JIRA_TOKEN:          ${JIRA_TOKEN:-}
      JIRA_PROJECT_KEY:    ${JIRA_PROJECT_KEY:-}
      SNOW_INSTANCE:       ${SNOW_INSTANCE:-}
      SNOW_USER:           ${SNOW_USER:-}
      SNOW_PASSWORD:       ${SNOW_PASSWORD:-}
    volumes:
      - logs:/app/logs

volumes:
  pgdata:
  logs:
