[DEFAULT]
# NIST NVD API key (optional but recommended)
apiKey =
# How often to check the API (seconds). 3600 = 1 hour.
checkFrequency = 3600
# Minimum CVSS severity to include: CRITICAL, HIGH, MEDIUM, LOW, NONE (default: all)
minSeverity = NONE
# Keywords managed via the Keywords screen in the TUI.
# Syntax: "Keyword" or "Keyword::MIN_SEVERITY" to override per-keyword.
# Example:  Apache Knox::HIGH
keywords =
# Generic webhook URL (receives JSON POST)
webhookUrl =
# Slack incoming webhook URL
slackWebhook =

[EMAIL]
# Gmail address used to send alerts
senderEmail =
# Google App Password (not your regular Gmail password)
# WARNING: stored in plain text — keep this file private
senderPassword =
# Recipient(s) — comma-separated for multiple addresses
recipientEmail =
# Subject line for alert emails
subjectLine = CVE Alert

[DATABASE]
# Backend: sqlite (default, no setup needed) or mysql
backend = sqlite
# MySQL-only settings — ignored when backend = sqlite
username =
password =
host = 127.0.0.1
database = cve_emailer
